# Example Nginx reverse proxy configuration for Synology NAS.
# Replace server_name and certificate paths with your own values.

server {
  listen 80;
  server_name apiyt.mi-nas.me ytcv.mi-nas.me;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name apiyt.mi-nas.me;

  ssl_certificate /path/to/fullchain.pem;
  ssl_certificate_key /path/to/privkey.pem;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  location /api/ {
    proxy_pass http://127.0.0.1:5550;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  location /logs/ {
    proxy_pass http://127.0.0.1:5551;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
}
