<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>500 - Something Broke</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: "Space Grotesk", sans-serif; background: #f8fafc; color: #0f172a; }
      .page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .card { max-width: 520px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 32px; text-align: center; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08); }
      h1 { margin: 0 0 12px; font-size: 48px; }
      p { margin: 0 0 20px; color: #475569; }
      a { display: inline-block; padding: 12px 20px; border-radius: 12px; background: #0b5fff; color: #ffffff; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>500</h1>
        <p>Oops. The server tripped over a cable. We are fixing it.</p>
        <a href="/">Go Home</a>
      </div>
    </div>
  </body>
</html>
