<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Maintenance - Be Right Back</title>
    <link rel="stylesheet" href="../css/main.css">
    <style>
      :root { color-scheme: light; }
      body { margin: 0; font-family: "Space Grotesk", "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
      .page { min-height: 100vh; display: grid; place-items: center; padding: var(--space-6); }
      .card { max-width: 520px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-3); padding: var(--space-8); text-align: center; box-shadow: 0 12px 24px var(--shadow); }
      h1 { margin: 0 0 var(--space-3); font-size: var(--font-display); }
      p { margin: 0 0 var(--space-4); color: var(--muted); }
      .action { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="card">
        <h1>Be Right Back</h1>
        <p>We are tuning the stream. Fresh videos coming soon.</p>
        <a class="button action" href="/">Go Home</a>
      </div>
    </div>
  </body>
</html>
