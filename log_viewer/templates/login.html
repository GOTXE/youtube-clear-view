<!doctype html>
<html lang="{{ 'es' if ui.username == 'Usuario' else 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ ui.title }}</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body class="gestor-body log-login-body">
    <main class="login-page-overlay log-login-overlay">
      <div class="login-page__masthead">
        <h1 class="login-page__masthead-title">{{ ui.app_name }}</h1>
      </div>
      <section class="login-page__card log-login-card">
        <div class="login-page__brand">{{ ui.brand }}</div>
        <p class="login-page__subtitle">{{ ui.subtitle }}</p>
        {% if error %}
          <div class="login-page__error" role="alert">{{ error }}</div>
        {% endif %}
        <form class="login-page__form" method="post" action="/logs/login">
          <label class="field">
            <span class="field__label">{{ ui.username }}</span>
            <input class="field__input" type="text" name="username" autocomplete="username" required>
          </label>
          <label class="field">
            <span class="field__label">{{ ui.password }}</span>
            <input class="field__input" type="password" name="password" autocomplete="current-password" required>
          </label>
          <button class="button login-page__submit login-form__submit" type="submit">{{ ui.submit }}</button>
        </form>
      </section>
      <footer class="app-footer login-page__footer log-login-footer" role="contentinfo">
        <p class="caption">GOTXE + ❤️ + IA 🤖</p>
        <div class="footer-links">
          <a class="footer-link" href="https://github.com/GOTXE/youtube-clear-view/issues/new?template=bug_report.yml" target="_blank" rel="noreferrer">
            <span>{{ ui.report_issue }}</span>
          </a>
          <a class="footer-link" href="https://github.com/GOTXE/youtube-clear-view" target="_blank" rel="noreferrer">
            GitHub
          </a>
        </div>
      </footer>
    </main>
  </body>
</html>
